<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoodEats App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="phone">

    <header class="top-tabs">
      <button class="active">Explore</button>
    </header>

    <section class="feed" id="feed">

      <article class="video-slide">
        <div class="video-box">
          <div class="loading-circle"></div>
          <div class="play-icon">▶</div>
        </div>

        <div class="caption">
          <p class="recipe-pill">Recipes coming soon.</p>
          <h3>GoodEats</h3>
          <p>Scroll through quick meals, cheap eats, and food ideas.</p>
        </div>
      </article>

      <article class="video-slide">
        <div class="video-box">
          <div class="loading-circle"></div>
          <div class="play-icon">▶</div>
        </div>

        <div class="caption">
          <p class="recipe-pill">Under $5 meal ideas.</p>
          <h3>Budget Meals</h3>
          <p>Find food based on your budget, tools, and time.</p>
        </div>
      </article>

      <article class="video-slide">
        <div class="video-box">
          <div class="loading-circle"></div>
          <div class="play-icon">▶</div>
        </div>

        <div class="caption">
          <p class="recipe-pill">No full kitchen needed.</p>
          <h3>Dorm Friendly</h3>
          <p>Microwave, air fryer, no-cook, and simple recipes.</p>
        </div>
      </article>

    </section>

    <nav class="bottom-nav">
      <button class="active">⌂<span>Home</span></button>
      <button class="post">+</button>
      <button>○<span>Profile</span></button>
    </nav>

  </main>

  <script src="script.js"></script>
</body>
</html>

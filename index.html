<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learnix App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="app">
    <header class="topbar">
      <h1>Learnix</h1>
      <div class="stats">
        <span>🔥 <b id="streak">1</b></span>
        <span>XP <b id="xp">0</b></span>
      </div>
    </header>

    <section class="hero-card">
      <p class="label">Current Course</p>
      <h2>Biology Basics</h2>
      <p>Start your first learning path with short lessons and quizzes.</p>

      <div class="progress-wrap">
        <div class="progress-bar">
          <div id="progressFill"></div>
        </div>
        <p id="progressText">0% complete</p>
      </div>
    </section>

    <section class="lessons">
      <h3>Lessons</h3>

      <button class="lesson-card" onclick="openLesson(0)">
        <span>01</span>
        <div>
          <h4>What is a cell?</h4>
          <p>Learn the basic unit of life.</p>
        </div>
      </button>

      <button class="lesson-card locked" onclick="openLesson(1)">
        <span>02</span>
        <div>
          <h4>Cell Parts</h4>
          <p>Explore organelles and their jobs.</p>
        </div>
      </button>

      <button class="lesson-card locked" onclick="openLesson(2)">
        <span>03</span>
        <div>
          <h4>Mitosis</h4>
          <p>Understand how cells divide.</p>
        </div>
      </button>
    </section>
  </main>

  <div class="modal" id="lessonModal">
    <div class="modal-box">
      <button class="close" onclick="closeLesson()">×</button>
      <p class="label" id="lessonNumber">Lesson 01</p>
      <h2 id="lessonTitle">What is a cell?</h2>
      <p id="lessonText"></p>

      <div class="quiz">
        <h3 id="question"></h3>
        <button onclick="answerQuiz(0)" id="choice0"></button>
        <button onclick="answerQuiz(1)" id="choice1"></button>
        <button onclick="answerQuiz(2)" id="choice2"></button>
      </div>

      <p id="feedback"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoodEats App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="feed">

    <section class="video-slide">
      <div class="loading-circle"></div>

      <div class="overlay">
        <p class="tag">GoodEats</p>
        <h1>Recipes coming soon</h1>
        <p>Scroll through quick meals, cheap eats, and food ideas.</p>
      </div>

      <div class="actions">
        <button>♡</button>
        <button>💬</button>
        <button>↗</button>
      </div>
    </section>

    <section class="video-slide">
      <div class="loading-circle"></div>

      <div class="overlay">
        <p class="tag">Budget Meals</p>
        <h1>Under $5 meals</h1>
        <p>Find food based on your budget, tools, and time.</p>
      </div>

      <div class="actions">
        <button>♡</button>
        <button>💬</button>
        <button>↗</button>
      </div>
    </section>

    <section class="video-slide">
      <div class="loading-circle"></div>

      <div class="overlay">
        <p class="tag">Dorm Friendly</p>
        <h1>No fancy kitchen needed</h1>
        <p>Microwave, air fryer, no-cook, and simple recipes.</p>
      </div>

      <div class="actions">
        <button>♡</button>
        <button>💬</button>
        <button>↗</button>
      </div>
    </section>

  </main>

  <nav class="bottom-nav">
    <button class="active">Home</button>
    <button>Search</button>
    <button>Upload</button>
    <button>Saved</button>
  </nav>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learnix App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="app">
    <header class="topbar">
      <h1>Learnix</h1>
      <div class="stats">
        <span>🔥 <b id="streak">1</b></span>
        <span>XP <b id="xp">0</b></span>
      </div>
    </header>

    <section id="homeScreen">
      <div class="course-header">
        <p class="label">Biology Basics</p>
        <h2>Start your path</h2>
        <p>Complete short quiz lessons and earn XP.</p>

        <div class="progress-bar">
          <div id="progressFill"></div>
        </div>
        <p id="progressText">0% complete</p>
      </div>

      <div class="lesson-path">
        <button class="lesson-bubble" onclick="startLesson(0)">1</button>
        <button class="lesson-bubble locked" onclick="startLesson(1)">2</button>
        <button class="lesson-bubble locked" onclick="startLesson(2)">3</button>
      </div>
    </section>

    <section id="lessonScreen" class="hidden">
      <button class="back-btn" onclick="goHome()">← Back</button>

      <div class="quiz-card">
        <p class="label" id="lessonLabel">Lesson 1</p>
        <h2 id="lessonTitle">What is a cell?</h2>
        <p id="lessonText"></p>

        <h3 id="question"></h3>

        <div id="choices"></div>

        <p id="feedback"></p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

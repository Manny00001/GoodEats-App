<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Dish | GoodEats</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0b;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      padding: 44px 18px;
    }

    .form-page {
      width: 100%;
      max-width: 640px;
    }

    .top-label {
      color: #d9a15f;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 {
      font-size: clamp(42px, 10vw, 76px);
      line-height: 0.95;
      letter-spacing: -4px;
      margin: 0 0 14px;
    }

    .subtitle {
      color: #c8c8c8;
      font-size: 18px;
      line-height: 1.5;
      margin-bottom: 34px;
      max-width: 560px;
    }

    form {
      display: grid;
      gap: 18px;
    }

    .field {
      background: #141414;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 20px;
      padding: 18px;
    }

    label {
      display: block;
      color: #d9a15f;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 9px;
    }

    input,
    textarea {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      background: #0f0f0f;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: rgba(217, 161, 95, 0.65);
    }

    textarea {
      min-height: 94px;
      resize: vertical;
    }

    .small-btn {
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(217, 161, 95, 0.28);
      border-radius: 14px;
      background: rgba(217, 161, 95, 0.08);
      color: #e0b57f;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    .small-btn:hover {
      background: rgba(217, 161, 95, 0.14);
    }

    .submit-btn {
      margin-top: 12px;
      padding: 17px;
      border: none;
      border-radius: 16px;
      background: #d9a15f;
      color: #0b0b0b;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #e0b57f;
    }

    .hint {
      color: #8f8f8f;
      font-size: 13px;
      margin: 9px 0 0;
    }

    .step-box,
    .tag-box {
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <main class="form-page">
    <p class="top-label">GoodEats Submission</p>
    <h1>Submit your dish.</h1>
    <p class="subtitle">
      Add a simple food idea for GoodEats. Keep it clear, realistic, and useful for someone deciding what to make.
    </p>

    <form action="https://formspree.io/f/xwvyerqr" method="POST">

      <div class="field">
        <label>Email</label>
        <input type="email" name="email" placeholder="your@email.com" required>
      </div>

      <div class="field">
        <label>Food Name</label>
        <input type="text" name="food_name" placeholder="Garlic Chicken Rice Bowl" required>
      </div>

      <div class="field">
        <label>Estimated Price</label>
        <input type="text" name="estimated_price" placeholder="$4.50">
      </div>

      <div class="field">
        <label>Ingredients</label>
        <textarea name="ingredients" placeholder="List the ingredients..." required></textarea>
      </div>

      <div class="field">
        <label>Main Cooking Appliances</label>
        <input type="text" name="appliances" placeholder="Microwave, air fryer, stove, oven">
      </div>

      <div class="field">
        <label>Steps</label>
        <div id="steps"></div>
        <button type="button" class="small-btn" id="addStepBtn">+ Add Step</button>
        <p class="hint">Maximum 10 steps.</p>
      </div>

      <div class="field">
        <label>Tags</label>
        <div id="tags"></div>
        <button type="button" class="small-btn" id="addTagBtn">+ Add Tag</button>
        <p class="hint">Maximum 3 tags. Example: cheap, quick, dorm-friendly.</p>
      </div>

      <button type="submit" class="submit-btn">Submit Dish</button>
    </form>
  </main>

  <script>
    const stepsDiv = document.getElementById("steps");
    const tagsDiv = document.getElementById("tags");
    const addStepBtn = document.getElementById("addStepBtn");
    const addTagBtn = document.getElementById("addTagBtn");

    let stepCount = 0;
    let tagCount = 0;

    function addStep() {
      if (stepCount >= 10) return;
      stepCount++;

      const wrap = document.createElement("div");
      wrap.className = "step-box";
      wrap.innerHTML = `
        <textarea 
          name="step_${stepCount}" 
          placeholder="Step ${stepCount}" 
          required
        ></textarea>
      `;

      stepsDiv.appendChild(wrap);

      if (stepCount >= 10) {
        addStepBtn.style.display = "none";
      }
    }

    function addTag() {
      if (tagCount >= 3) return;
      tagCount++;

      const wrap = document.createElement("div");
      wrap.className = "tag-box";
      wrap.innerHTML = `
        <input 
          type="text" 
          name="tag_${tagCount}" 
          placeholder="Tag ${tagCount}"
        >
      `;

      tagsDiv.appendChild(wrap);

      if (tagCount >= 3) {
        addTagBtn.style.display = "none";
      }
    }

    addStepBtn.addEventListener("click", addStep);
    addTagBtn.addEventListener("click", addTag);

    addStep();
    addTag();
  </script>

</body>
</html>

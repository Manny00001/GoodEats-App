<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Dish | GoodEats</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0b;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      padding: 40px 18px;
    }

    .form-page {
      width: 100%;
      max-width: 620px;
    }

    h1 {
      font-size: clamp(42px, 10vw, 78px);
      line-height: 0.95;
      letter-spacing: -4px;
      margin: 0 0 12px;
    }

    .subtitle {
      color: #cfcfcf;
      font-size: 18px;
      line-height: 1.45;
      margin-bottom: 32px;
    }

    form {
      display: grid;
      gap: 18px;
    }

    label {
      display: block;
      font-weight: 800;
      color: #ffb347;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    input,
    textarea {
      width: 100%;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      background: #181818;
      color: white;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 95px;
      resize: vertical;
    }

    .small-btn {
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(255, 159, 28, 0.35);
      border-radius: 14px;
      background: rgba(255, 159, 28, 0.12);
      color: #ffb347;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    .submit-btn {
      margin-top: 12px;
      padding: 17px;
      border: none;
      border-radius: 14px;
      background: #ff9f1c;
      color: white;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
    }

    .hint {
      color: #999;
      font-size: 13px;
      margin: 8px 0 0;
    }

    .step-box,
    .tag-box {
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <main class="form-page">
    <h1>Submit your dish.</h1>
    <p class="subtitle">
      Share a food idea for GoodEats. Add the name, price, ingredients, appliances, steps, and up to three tags.
    </p>

    <form action="https://formspree.io/f/xwvyerqr" method="POST">

      <div>
        <label>Email</label>
        <input type="email" name="email" placeholder="your@email.com" required>
      </div>

      <div>
        <label>Food Name</label>
        <input type="text" name="food_name" placeholder="Example: Garlic Chicken Rice Bowl" required>
      </div>

      <div>
        <label>Estimated Price</label>
        <input type="text" name="estimated_price" placeholder="Example: $4.50">
      </div>

      <div>
        <label>Ingredients</label>
        <textarea name="ingredients" placeholder="List the ingredients..." required></textarea>
      </div>

      <div>
        <label>Main Cooking Appliances</label>
        <input type="text" name="appliances" placeholder="Example: microwave, air fryer, stove, oven">
      </div>

      <div>
        <label>Steps</label>
        <div id="steps"></div>
        <button type="button" class="small-btn" id="addStepBtn">+ Add Step</button>
        <p class="hint">Maximum 10 steps.</p>
      </div>

      <div>
        <label>Tags</label>
        <div id="tags"></div>
        <button type="button" class="small-btn" id="addTagBtn">+ Add Tag</button>
        <p class="hint">Maximum 3 tags. Example: cheap, quick, dorm-friendly.</p>
      </div>

      <button type="submit" class="submit-btn">Submit Dish</button>
    </form>
  </main>

  <script>
    const stepsDiv = document.getElementById("steps");
    const tagsDiv = document.getElementById("tags");
    const addStepBtn = document.getElementById("addStepBtn");
    const addTagBtn = document.getElementById("addTagBtn");

    let stepCount = 0;
    let tagCount = 0;

    function addStep() {
      if (stepCount >= 10) return;

      stepCount++;

      const wrap = document.createElement("div");
      wrap.className = "step-box";

      wrap.innerHTML = `
        <textarea 
          name="step_${stepCount}" 
          placeholder="Step ${stepCount}" 
          required
        ></textarea>
      `;

      stepsDiv.appendChild(wrap);

      if (stepCount >= 10) {
        addStepBtn.style.display = "none";
      }
    }

    function addTag() {
      if (tagCount >= 3) return;

      tagCount++;

      const wrap = document.createElement("div");
      wrap.className = "tag-box";

      wrap.innerHTML = `
        <input 
          type="text" 
          name="tag_${tagCount}" 
          placeholder="Tag ${tagCount}" 
        >
      `;

      tagsDiv.appendChild(wrap);

      if (tagCount >= 3) {
        addTagBtn.style.display = "none";
      }
    }

    addStepBtn.addEventListener("click", addStep);
    addTagBtn.addEventListener("click", addTag);

    addStep();
    addTag();
  </script>

</body>
</html>

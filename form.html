<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Recipe | GoodEats</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f1ec;
      --text: #171717;
      --muted: #666;
      --line: #1f1f1f;
      --accent: #c7864a;
      --error: #c62828;
    }

    body {
      margin: 0;
      background: #e9e4de;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      padding: 28px 16px;
    }

    .page {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      background: var(--bg);
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 20px 50px rgba(0,0,0,0.08);
      padding: 28px 22px 30px;
    }

    .topbar {
      text-align: center;
      margin-bottom: 18px;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 64px);
      letter-spacing: 2px;
      font-weight: 300;
    }

    .top-line,
    .bottom-line {
      height: 4px;
      background: var(--line);
      margin: 22px 0 26px;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 30px;
    }

    .left-col,
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .section {
      border-bottom: 2px solid rgba(0,0,0,0.18);
      padding-bottom: 18px;
    }

    .section:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .field-block {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #333;
    }

    input,
    textarea {
      width: 100%;
      border: none;
      border-bottom: 2px solid rgba(0,0,0,0.22);
      background: transparent;
      padding: 10px 2px 8px;
      font-size: 18px;
      color: var(--text);
      outline: none;
      border-radius: 0;
    }

    input:focus,
    textarea:focus {
      border-bottom-color: var(--accent);
    }

    textarea {
      min-height: 82px;
      resize: vertical;
      line-height: 1.45;
    }

    .short-textarea {
      min-height: 62px;
    }

    .step-item textarea {
      min-height: 58px;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
    }

    .chip-input {
      border: 1px solid rgba(0,0,0,0.16);
      background: rgba(255,255,255,0.45);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 14px;
    }

    .step-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .remove-step {
      border: none;
      background: transparent;
      color: var(--error);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .small-btn,
    .submit-btn {
      border: 1px solid rgba(0,0,0,0.18);
      cursor: pointer;
      font-weight: 700;
      transition: 0.15s ease;
    }

    .small-btn {
      background: #fff;
      color: var(--text);
      padding: 10px 14px;
      font-size: 14px;
    }

    .small-btn:hover {
      background: #f1ece6;
    }

    .small-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .submit-wrap {
      margin-top: 8px;
      display: flex;
      justify-content: flex-end;
    }

    .submit-btn {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      padding: 14px 22px;
      font-size: 15px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .required-note,
    .word-count {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .error-text {
      display: none;
      margin-top: 6px;
      color: var(--error);
      font-size: 12px;
      font-weight: 700;
    }

    .field-error .error-text {
      display: block;
    }

    .field-error input,
    .field-error textarea {
      border-bottom-color: var(--error);
    }

    .footer-mark {
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: #444;
      font-size: 13px;
    }

    .footer-mark .plate {
      font-size: 18px;
      letter-spacing: 5px;
    }

    @media (max-width: 860px) {
      form {
        grid-template-columns: 1fr;
      }

      .page {
        padding: 22px 16px 24px;
      }
    }

    @media (max-width: 560px) {
      .row-2 {
        grid-template-columns: 1fr;
      }

      input,
      textarea {
        font-size: 16px;
      }

      .submit-wrap {
        justify-content: stretch;
      }

      .submit-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="topbar">
      <div class="eyebrow">GoodEats Submission</div>
      <h1>RECIPE CARD</h1>
    </div>

    <div class="top-line"></div>

    <form id="recipeForm" action="https://formspree.io/f/xwvyerqr" method="POST" novalidate autocomplete="off">
      <div class="left-col">
        <section class="section">
          <h2 class="section-title">Recipe Details</h2>

          <div class="field-block required-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" />
            <div class="error-text">This field is required.</div>
          </div>

          <div class="field-block required-field">
            <label for="your_name">Your Name</label>
            <input id="your_name" name="your_name" type="text" placeholder="Your name" />
            <div class="error-text">This field is required.</div>
          </div>

          <div class="field-block required-field">
            <label for="food_name">Recipe Name</label>
            <input id="food_name" name="food_name" type="text" placeholder="Example: Garlic Butter Pasta" />
            <div class="error-text">This field is required.</div>
          </div>

          <div class="field-block required-field">
            <label for="recipe_description">Recipe Description</label>
            <textarea id="recipe_description" name="recipe_description" class="short-textarea" placeholder="Short description, max 30 words."></textarea>
            <div class="word-count" id="descCount">0 / 30 words</div>
            <div class="error-text">This field is required.</div>
          </div>

          <div class="row-2">
            <div class="field-block">
              <label for="estimated_price">Estimated Price</label>
              <input id="estimated_price" name="estimated_price" type="text" placeholder="$6.50" />
            </div>

            <div class="field-block">
              <label for="servings">Quantity / Servings</label>
              <input id="servings" name="servings" type="text" placeholder="2 people" />
            </div>
          </div>

          <div class="row-2">
            <div class="field-block">
              <label for="prep_time">Time to Prepare</label>
              <input id="prep_time" name="prep_time" type="text" placeholder="15 minutes" />
            </div>

            <div class="field-block">
              <label for="cook_time">Time to Cook</label>
              <input id="cook_time" name="cook_time" type="text" placeholder="20 minutes" />
            </div>
          </div>

          <div class="row-2">
            <div class="field-block">
              <label for="difficulty">Difficulty (1-10)</label>
              <input id="difficulty" name="difficulty" type="text" placeholder="4" />
            </div>

            <div class="field-block">
              <label for="temperature">Cooking Temperature</label>
              <input id="temperature" name="temperature" type="text" placeholder="375°F / 190°C" />
            </div>
          </div>

          <div class="field-block">
            <label for="country_origin">Country of Origin</label>
            <input id="country_origin" name="country_origin" type="text" placeholder="Optional" />
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">Cooking Info</h2>

          <div class="field-block">
            <label for="appliances">Main Cooking Appliances</label>
            <input id="appliances" name="appliances" type="text" placeholder="Stove, oven, microwave, air fryer..." />
          </div>

          <div class="field-block">
            <label>Tags</label>
            <div id="tags" class="chips"></div>
            <div class="btn-row">
              <button type="button" class="small-btn" id="addTagBtn">Add Tag</button>
            </div>
            <div class="required-note">Maximum 3 tags.</div>
          </div>
        </section>
      </div>

      <div class="right-col">
        <section class="section">
          <h2 class="section-title">Ingredients</h2>

          <div class="field-block required-field">
            <label for="ingredients">Ingredient List</label>
            <textarea id="ingredients" name="ingredients" placeholder="List each ingredient clearly..."></textarea>
            <div class="error-text">This field is required.</div>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">Preparation</h2>

          <div id="steps"></div>

          <div class="btn-row">
            <button type="button" class="small-btn" id="addStepBtn">Add Step</button>
          </div>

          <div class="required-note">Add up to 10 steps.</div>
        </section>

        <div class="submit-wrap">
          <button type="submit" class="submit-btn">Submit Recipe</button>
        </div>
      </div>
    </form>

    <div class="footer-mark">
      <div>GoodEats recipe submission form</div>
      <div class="plate">○ ○ ○</div>
    </div>

    <div class="bottom-line"></div>
  </main>

  <script>
    const form = document.getElementById("recipeForm");
    const stepsDiv = document.getElementById("steps");
    const tagsDiv = document.getElementById("tags");
    const addStepBtn = document.getElementById("addStepBtn");
    const addTagBtn = document.getElementById("addTagBtn");
    const desc = document.getElementById("recipe_description");
    const descCount = document.getElementById("descCount");

    let stepCount = 0;
    let tagCount = 0;

    function countWords(text) {
      return text.trim().split(/\s+/).filter(Boolean).length;
    }

    desc.addEventListener("input", () => {
      let words = desc.value.trim().split(/\s+/).filter(Boolean);

      if (words.length > 30) {
        words = words.slice(0, 30);
        desc.value = words.join(" ");
      }

      descCount.textContent = `${words.length} / 30 words`;
    });

    function refreshStepNames() {
      const stepItems = stepsDiv.querySelectorAll(".step-item");

      stepItems.forEach((item, index) => {
        const num = index + 1;
        const label = item.querySelector("label");
        const textarea = item.querySelector("textarea");

        label.setAttribute("for", `step_${num}`);
        label.textContent = `Step ${num}`;
        textarea.id = `step_${num}`;
        textarea.name = `step_${num}`;
        textarea.placeholder = `Describe step ${num}...`;
      });

      stepCount = stepItems.length;
      addStepBtn.disabled = stepCount >= 10;
    }

    function createRequiredStep(num) {
      const wrap = document.createElement("div");
      wrap.className = "field-block required-field step-item";
      wrap.innerHTML = `
        <div class="step-head">
          <label for="step_${num}">Step ${num}</label>
          <button type="button" class="remove-step">Remove</button>
        </div>
        <textarea id="step_${num}" name="step_${num}" placeholder="Describe step ${num}..."></textarea>
        <div class="error-text">This field is required.</div>
      `;

      wrap.querySelector(".remove-step").addEventListener("click", () => {
        if (stepsDiv.children.length <= 1) return;
        wrap.remove();
        refreshStepNames();
      });

      return wrap;
    }

    function createTag(num) {
      const input = document.createElement("input");
      input.className = "chip-input";
      input.type = "text";
      input.name = "tag_" + num;
      input.placeholder = "Tag " + num;
      return input;
    }

    function addStep() {
      if (stepCount >= 10) return;
      stepCount += 1;
      stepsDiv.appendChild(createRequiredStep(stepCount));
      refreshStepNames();
    }

    function addTag() {
      if (tagCount >= 3) return;
      tagCount += 1;
      tagsDiv.appendChild(createTag(tagCount));
      if (tagCount >= 3) addTagBtn.disabled = true;
    }

    addStepBtn.addEventListener("click", addStep);
    addTagBtn.addEventListener("click", addTag);

    addStep();
    addTag();

    function validateField(block) {
      const input = block.querySelector("input, textarea");
      const value = input ? input.value.trim() : "";
      const valid = value !== "";

      block.classList.toggle("field-error", !valid);
      return valid;
    }

    form.addEventListener("submit", function (e) {
      const requiredBlocks = form.querySelectorAll(".required-field");
      let allValid = true;

      requiredBlocks.forEach((block) => {
        if (!validateField(block)) {
          allValid = false;
        }
      });

      if (!allValid) {
        e.preventDefault();
      }
    });

    form.addEventListener("input", function (e) {
      const block = e.target.closest(".required-field");
      if (block) validateField(block);
    });
  </script>
</body>
</html>
